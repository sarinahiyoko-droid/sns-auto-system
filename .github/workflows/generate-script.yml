
name: Generate Japanese Trivia Script

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate script with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise RuntimeError("GEMINI_API_KEY is not configured.")

          prompt = """
          あなたは日本語のショート動画の構成作家です。動物をテーマにしないでください。

          いらすとやのイラストを1シーン1点だけ使った、最後まで見たくなる短尺動画を作ってください。
          テーマはネット・SNS・スマホの身近な仕組み、またはメイク・美容の実用知識に限定します。

          【動画の基本設定】
          ・縦型ショート動画
          ・動画の長さは約20秒
          ・4つのシーンで構成
          ・各シーンは5秒
          ・自然で親しみやすい日本語
          ・男性ナレーターが読み上げることを想定
          ・説明はテンポよく、短い文で、間延びさせない
          ・難しい専門用語は避ける

          【構成】
          1. 冒頭：驚きや疑問を感じる一言
          2. 疑問：視聴者が続きを知りたくなる展開
          3. 解説：理由や仕組みを分かりやすく説明
          4. 結論：意外性のある答えで締める

          【ナレーション】
          ・自然な会話調にする
          ・最初の一言で興味を引く
          ・説明を詰め込みすぎない
          ・同じ内容を繰り返さない
          ・最後まで聞きたくなる流れにする
          ・ナレーション全文は135〜155文字にする（句読点も1文字として数える）
          ・早口でも聞き取れる短文中心。1文を短くし、余計な前置きは入れない
          ・短くまとめすぎず、4シーンそれぞれの内容がナレーションに入るようにする
          ・文字数が足りない場合は、確認済みの事実の説明を具体的に補い、同じ意味の繰り返しで水増ししない
          ・20秒で自然に読み切れる量にする

          【字幕】
          ・各シーンの字幕は短くする
          ・一目で意味が伝わる表現にする
          ・重要な言葉を強調できるようにする

          【イラスト指定】
          ・各シーンで「いらすとや」のイラストを1点だけ使う
          ・illustration_keywordsは、いらすとやサイト内で検索しやすい具体的な名詞を1つだけ指定する
          ・ネット系はスマートフォン、パソコン、鍵、メール、Wi-Fiなど。メイク系は口紅、化粧ブラシ、鏡、化粧品など
          ・動物をテーマにしない。動物イラストを検索語にしない
          ・各シーンの主役を1つに絞り、説明内容と直接結びつける
          ・AI画像を生成する指示は書かない
          ・実際に存在する素材だと断定しない

          【演出指定】
          ・背景は白。中央にイラスト1点、画面下部に短い字幕だけのシンプルな画面
          ・余計な飾りや複数のイラストを前提にしない
          ・visual_noteには中央に大きく表示する主役を書く
          ・highlightには字幕で強調する短い言葉を1つ入れる
          ・motionにはゆっくり拡大など控えめな動きを指定する

          【正確性】
          ・科学的、歴史的に正確な内容を優先する
          ・不確かな情報を事実のように書かない
          ・数字や研究結果を勝手に作らない
          ・参考情報源を確認済みだと偽らない
          ・確かな参考URLが分からない場合は空文字にする
          ・一般的なトップページを無理に参考URLにしない

          【出力形式】
          必ず次のJSON形式だけで回答してください。
          Markdownやコードブロックは不要です。

          {
            "title": "動画タイトル",
            "topic": "雑学テーマ",
            "narration": "ナレーション全文",
            "scenes": [
              {
                "text": "字幕1",
                "start": 0,
                "end": 5,
                "illustration_keywords": ["検索語1", "検索語2"],
                "visual_note": "画面に表示するイラストの説明",
                "highlight": "強調する言葉",
                "motion": "イラストの動き"
              },
              {
                "text": "字幕2",
                "start": 5,
                "end": 10,
                "illustration_keywords": ["検索語1", "検索語2"],
                "visual_note": "画面に表示するイラストの説明",
                "highlight": "強調する言葉",
                "motion": "イラストの動き"
              },
              {
                "text": "字幕3",
                "start": 10,
                "end": 15,
                "illustration_keywords": ["検索語1", "検索語2"],
                "visual_note": "画面に表示するイラストの説明",
                "highlight": "強調する言葉",
                "motion": "イラストの動き"
              },
              {
                "text": "字幕4",
                "start": 15,
                "end": 20,
                "illustration_keywords": ["検索語1", "検索語2"],
                "visual_note": "画面に表示するイラストの説明",
                "highlight": "強調する言葉",
                "motion": "イラストの動き"
              }
            ],
            "sources": [
              {
                "title": "参考情報源の名前",
                "url": "確認できる場合のみURL"
              }
            ]
          }
          """

          # Rotate through a larger bank of source-backed internet and makeup topics.
          topic_bank = json.loads(
              Path("content/weekday-topics.json").read_text(encoding="utf-8")
          )
          from datetime import date
          topic_number = ((date.today() - date(2026, 11, 19)).days % len(topic_bank)) + 1
          topic_plan = topic_bank[str(topic_number)]

          prompt += (
              "\n\n【今回のテーマ】" + topic_plan["topic"]
              + "\n【確認済みの事実】" + topic_plan["fact"]
              + "\nこの事実から外れた推測や数字を追加しないでください。"
              + "\n【必ず記載する参考情報源】" + topic_plan["source"]["title"]
              + " " + topic_plan["source"]["url"]
              + "\n週5本のシリーズとして、同じ結論や導入文を繰り返さないでください。"
          )

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.5-flash-lite:generateContent"
          )

          data = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }],
              "generationConfig": {
                  "responseMimeType": "application/json",
                  "temperature": 0.7,
                  "maxOutputTokens": 3500
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              print("Gemini API error:", error.code)
              print(error.read().decode("utf-8"))
              raise

          text = result["candidates"][0]["content"]["parts"][0]["text"]
          script = json.loads(text)

          # Keep narration concise and energetic; do not pad with generic filler.

          required_fields = [
              "title", "topic", "narration", "scenes", "sources"
          ]

          for field in required_fields:
              if field not in script:
                  raise ValueError(f"Missing required field: {field}")

          if len(script["scenes"]) != 4:
              raise ValueError("Exactly 4 scenes are required.")

          sources = script.get("sources", [])
          required_source_url = topic_plan["source"]["url"]
          if not any(
              source.get("url") == required_source_url
              for source in sources
          ):
              raise ValueError("The scheduled topic's verified source URL must be included.")

          print("Narration character count:", len(script["narration"]))
          if len(script["narration"]) < 120:
              raise ValueError("Narration is too short for a 20-second short.")
          if len(script["narration"]) > 160:
              raise ValueError("Narration is too long for a 20-second short.")

          expected_times = [
              (0, 5),
              (5, 10),
              (10, 15),
              (15, 20)
          ]

          for scene, (start, end) in zip(
              script["scenes"], expected_times
          ):
              if scene["start"] != start or scene["end"] != end:
                  raise ValueError("Scene timing is incorrect.")

              for field in [
                  "text",
                  "illustration_keywords",
                  "visual_note",
                  "highlight",
                  "motion"
              ]:
                  if field not in scene:
                      raise ValueError(f"Missing scene field: {field}")

              if not scene["text"].strip():
                  raise ValueError("Scene subtitle is empty.")

              if not isinstance(scene["illustration_keywords"], list):
                  raise ValueError("Illustration keywords must be a list.")

              if not scene["illustration_keywords"]:
                  raise ValueError("Illustration keywords are empty.")

              if len(scene["illustration_keywords"]) != 1:
                  raise ValueError("Use exactly one illustration search keyword per scene.")
              keyword = str(scene["illustration_keywords"][0]).strip()
              if not keyword or len(keyword) > 20:
                  raise ValueError("Use one short, concrete Irasutoya search keyword.")

          if not script["narration"].strip():
              raise ValueError("Narration is empty.")

          Path("content").mkdir(exist_ok=True)

          Path("content/script.json").write_text(
              json.dumps(script, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Script generated successfully!")
          print(json.dumps(script, ensure_ascii=False, indent=2))
          PY

      - name: Save script to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/script.json

          if git diff --cached --quiet; then
            echo "No script changes."
          else
            git commit -m "Update generated trivia script"
            git pull --rebase origin main
            git push
          fi

      - name: Save generated script artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-script
          path: content/script.json
          retention-days: 7
