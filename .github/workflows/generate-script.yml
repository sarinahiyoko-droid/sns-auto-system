
name: Generate Japanese Trivia Script

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate script with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from pathlib import Path

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise RuntimeError("GEMINI_API_KEY is not configured.")

          prompt = """
          あなたは日本語の雑学ショート動画の構成作家です。

          いらすとやのイラストを使った、
          見ていて楽しく、最後まで見たくなる雑学動画を作ってください。

          【動画の基本設定】
          ・縦型ショート動画
          ・動画の長さは約20秒
          ・4つのシーンで構成
          ・各シーンは5秒
          ・自然で親しみやすい日本語
          ・男性ナレーターが読み上げることを想定
          ・難しい専門用語は避ける

          【構成】
          1. 冒頭：驚きや疑問を感じる一言
          2. 疑問：視聴者が続きを知りたくなる展開
          3. 解説：理由や仕組みを分かりやすく説明
          4. 結論：意外性のある答えで締める

          【ナレーション】
          ・自然な会話調にする
          ・最初の一言で興味を引く
          ・説明を詰め込みすぎない
          ・同じ内容を繰り返さない
          ・最後まで聞きたくなる流れにする

          【字幕】
          ・各シーンの字幕は短くする
          ・一目で意味が伝わる表現にする
          ・重要な言葉を強調できるようにする

          【イラスト指定】
          ・各シーンに合う「いらすとや」のイラストを想定する
          ・illustration_keywordsには検索に使える日本語キーワードを2〜3個入れる
          ・できるだけ具体的な名詞にする
          ・例：「パンダ」「竹」「雪山」
          ・AI画像を生成する指示は書かない
          ・実際に存在する素材だと断定しない
          ・同じイラストばかり使わないようにする
          ・説明に必要な物や動物を優先する

          【演出指定】
          ・visual_noteには画面に表示するイラストの使い方を書く
          ・highlightには目立たせる短い言葉を1つ入れる
          ・motionには簡単な動きの指示を入れる
          ・例：拡大、左から登場、ゆっくり移動、揺れる

          【正確性】
          ・科学的、歴史的に正確な内容を優先する
          ・不確かな情報を事実のように書かない
          ・数字や研究結果を勝手に作らない
          ・参考情報源を確認済みだと偽らない
          ・確かな参考URLが分からない場合は空文字にする
          ・一般的なトップページを無理に参考URLにしない

          【出力形式】
          必ず次のJSON形式だけで回答してください。
          Markdownやコードブロックは不要です。

          {
            "title": "動画タイトル",
            "topic": "雑学テーマ",
            "narration": "ナレーション全文",
            "scenes": [
              {
                "text": "字幕1",
                "start": 0,
                "end": 5,
                "illustration_keywords": ["検索語1", "検索語2"],
                "visual_note": "画面に表示するイラストの説明",
                "highlight": "強調する言葉",
                "motion": "イラストの動き"
              },
              {
                "text": "字幕2",
                "start": 5,
                "end": 10,
                "illustration_keywords": ["検索語1", "検索語2"],
                "visual_note": "画面に表示するイラストの説明",
                "highlight": "強調する言葉",
                "motion": "イラストの動き"
              },
              {
                "text": "字幕3",
                "start": 10,
                "end": 15,
                "illustration_keywords": ["検索語1", "検索語2"],
                "visual_note": "画面に表示するイラストの説明",
                "highlight": "強調する言葉",
                "motion": "イラストの動き"
              },
              {
                "text": "字幕4",
                "start": 15,
                "end": 20,
                "illustration_keywords": ["検索語1", "検索語2"],
                "visual_note": "画面に表示するイラストの説明",
                "highlight": "強調する言葉",
                "motion": "イラストの動き"
              }
            ],
            "sources": [
              {
                "title": "参考情報源の名前",
                "url": "確認できる場合のみURL"
              }
            ]
          }
          """

          illustration_map = json.loads(
              Path("content/illustration-map.json").read_text(encoding="utf-8")
          )
          available_keywords = sorted({
              keyword
              for item in illustration_map
              for keyword in item.get("keywords", [])
          })
          prompt += (
              "\n\n【今回利用できる素材キーワード】\n"
              + "、".join(available_keywords)
              + "\n各シーンのillustration_keywordsには、この一覧の語だけを使ってください。"
              + "\n今回のテーマはジャイアントパンダの白黒模様・保護色・コミュニケーションに限定してください。"
              + "\n研究結果は確定した事実と言い切らず「研究では〜と考えられている」と説明してください。"
              + "\n参考情報源には次の論文を必ず記載してください：Caro et al. (2017), Why is the giant panda black and white?, Behavioral Ecology, https://doi.org/10.1093/beheco/arx008"
          )

          url = (
              "https://generativelanguage.googleapis.com/"
              "v1beta/models/gemini-3.5-flash-lite:generateContent"
          )

          data = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }],
              "generationConfig": {
                  "responseMimeType": "application/json",
                  "temperature": 0.7,
                  "maxOutputTokens": 3500
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(data).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              print("Gemini API error:", error.code)
              print(error.read().decode("utf-8"))
              raise

          text = result["candidates"][0]["content"]["parts"][0]["text"]
          script = json.loads(text)

          required_fields = [
              "title", "topic", "narration", "scenes", "sources"
          ]

          for field in required_fields:
              if field not in script:
                  raise ValueError(f"Missing required field: {field}")

          if len(script["scenes"]) != 4:
              raise ValueError("Exactly 4 scenes are required.")

          available_keyword_set = set(available_keywords)
          sources = script.get("sources", [])
          if not sources or not any(
              str(source.get("url", "")).startswith("https://")
              for source in sources
          ):
              raise ValueError("At least one HTTPS source URL is required.")

          if len(script["narration"]) > 125:
              raise ValueError("Narration is too long for a 20-second short.")

          expected_times = [
              (0, 5),
              (5, 10),
              (10, 15),
              (15, 20)
          ]

          for scene, (start, end) in zip(
              script["scenes"], expected_times
          ):
              if scene["start"] != start or scene["end"] != end:
                  raise ValueError("Scene timing is incorrect.")

              for field in [
                  "text",
                  "illustration_keywords",
                  "visual_note",
                  "highlight",
                  "motion"
              ]:
                  if field not in scene:
                      raise ValueError(f"Missing scene field: {field}")

              if not scene["text"].strip():
                  raise ValueError("Scene subtitle is empty.")

              if not isinstance(scene["illustration_keywords"], list):
                  raise ValueError("Illustration keywords must be a list.")

              if not scene["illustration_keywords"]:
                  raise ValueError("Illustration keywords are empty.")

              if len(scene["illustration_keywords"]) > 2:
                  raise ValueError("Use no more than 2 illustration keywords per scene.")

              if not any(
                  keyword in available_keyword_set
                  for keyword in scene["illustration_keywords"]
              ):
                  raise ValueError("Each scene must match at least one curated Irasutoya keyword.")

          if not script["narration"].strip():
              raise ValueError("Narration is empty.")

          Path("content").mkdir(exist_ok=True)

          Path("content/script.json").write_text(
              json.dumps(script, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Script generated successfully!")
          print(json.dumps(script, ensure_ascii=False, indent=2))
          PY

      - name: Save script to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/script.json

          if git diff --cached --quiet; then
            echo "No script changes."
          else
            git commit -m "Update generated trivia script"
            git push
          fi

      - name: Save generated script artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-script
          path: content/script.json
          retention-days: 7
