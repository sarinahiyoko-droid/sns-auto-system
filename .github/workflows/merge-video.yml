name: Merge Video and Audio

on:
  workflow_dispatch:
    inputs:
      video_run_id:
        description: "空欄なら最新の成功した Generate Video を自動選択"
        required: false
        default: ""
        type: string
      audio_run_id:
        description: "空欄なら最新の成功した Generate Japanese Audio を自動選択"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  merge:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Resolve artifact run IDs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_RUN_ID_INPUT: ${{ inputs.video_run_id }}
          AUDIO_RUN_ID_INPUT: ${{ inputs.audio_run_id }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          video_id="$VIDEO_RUN_ID_INPUT"
          audio_id="$AUDIO_RUN_ID_INPUT"

          if [ -z "$video_id" ]; then
            video_id="$(gh run list --workflow "Generate Video" --branch "$GITHUB_REF_NAME" --status success --limit 20 --json databaseId,headSha --jq --arg sha "$current_sha" '[.[] | select(.headSha == $sha)][0].databaseId // empty')"
          fi

          if [ -z "$audio_id" ]; then
            audio_id="$(gh run list --workflow "Generate Japanese Audio" --branch "$GITHUB_REF_NAME" --status success --limit 20 --json databaseId,headSha --jq --arg sha "$current_sha" '[.[] | select(.headSha == $sha)][0].databaseId // empty')"
          fi

          if [ -z "$video_id" ] || [ -z "$audio_id" ]; then
            echo "No successful video/audio artifacts were found for the current code version."
            echo "Run Generate Video and Generate Japanese Audio again, then retry."
            exit 1
          fi

          video_sha="$(gh run view "$video_id" --json headSha --jq .headSha)"
          audio_sha="$(gh run view "$audio_id" --json headSha --jq .headSha)"
          if [ "$video_sha" != "$current_sha" ] || [ "$audio_sha" != "$current_sha" ]; then
            echo "The selected artifacts were generated from a different code version."
            echo "Regenerate both video and audio from the current repository version."
            exit 1
          fi

          echo "Using current code version: $current_sha"
          echo "Using video run: $video_id"
          echo "Using audio run: $audio_id"
          echo "video_run_id=$video_id" >> "$GITHUB_OUTPUT"
          echo "audio_run_id=$audio_id" >> "$GITHUB_OUTPUT"

      - name: Download generated video
        uses: actions/download-artifact@v4
        with:
          name: generated-video
          path: input/video
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.video_run_id }}

      - name: Download generated audio
        uses: actions/download-artifact@v4
        with:
          name: japanese-audio
          path: input/audio
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.audio_run_id }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Merge video and audio
        run: |
          mkdir -p output

          ffmpeg -y \
            -i input/video/video.mp4 \
            -i input/audio/audio.wav \
            -filter_complex "[1:a:0]apad[aout]" \
            -map 0:v:0 \
            -map "[aout]" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            output/final-video.mp4

          test -s output/final-video.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/final-video.mp4

      - name: Save final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: output/final-video.mp4
          retention-days: 7
