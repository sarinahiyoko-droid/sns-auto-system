name: Test Video Renderer

on:
  push:
    paths:
      - ".github/workflows/test-illustration-build.yml"
      - "scripts/render_video.py"
      - "scripts/download_illustrations.py"
      - "content/illustration-map.json"
      - "content/script.json"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-renderer-smoke-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install Pillow PyYAML

      - name: Validate script JSON
        run: python -m json.tool content/script.json > /dev/null

      - name: Validate workflow YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"Valid YAML: {path}")
          PY

      - name: Download curated official Irasutoya images
        run: python scripts/download_illustrations.py

      - name: Render vertical video
        run: python scripts/render_video.py

      - name: Verify generated MP4
        run: |
          test -s output/video.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/video.mp4)
          SIZE=$(stat -c%s output/video.mp4)
          echo "Duration: $DURATION seconds"
          echo "Size: $SIZE bytes"
          awk -v d="$DURATION" 'BEGIN { if (d < 19 || d > 21) exit 1 }'

      - name: Upload renderer test video
        uses: actions/upload-artifact@v4
        with:
          name: video-renderer-smoke-test
          path: output/video.mp4
          retention-days: 3
