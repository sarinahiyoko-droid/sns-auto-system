name: Test Video Renderer

on:
  push:
    paths:
      - ".github/workflows/test-illustration-build.yml"
      - "scripts/render_video.py"
      - "content/script.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Validate script JSON
        run: python -m json.tool content/script.json > /dev/null

      - name: Create temporary renderer test images
        run: |
          mkdir -p assets/illustrations
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          out = Path("assets/illustrations")
          for i in range(1, 5):
              image = Image.new("RGBA", (700, 600), (0, 0, 0, 0))
              draw = ImageDraw.Draw(image)
              draw.ellipse((100, 40, 600, 540), fill=(255, 220, 90, 255), outline=(40, 55, 75, 255), width=12)
              draw.ellipse((230, 190, 300, 270), fill=(30, 30, 30, 255))
              draw.ellipse((400, 190, 470, 270), fill=(30, 30, 30, 255))
              draw.arc((250, 230, 450, 420), 10, 170, fill=(30, 30, 30, 255), width=14)
              image.save(out / f"scene{i}-image1.png")
          PY

      - name: Render vertical video
        run: python scripts/render_video.py

      - name: Verify generated MP4
        run: |
          test -s output/video.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/video.mp4

      - name: Upload renderer test video
        uses: actions/upload-artifact@v4
        with:
          name: video-renderer-smoke-test
          path: output/video.mp4
          retention-days: 3
