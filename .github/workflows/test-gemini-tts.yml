name: Test Gemini Male TTS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-tts-smoke-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate male Japanese narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_audio.py

      - name: Validate audio
        run: |
          python - <<'PY'
          import wave
          from pathlib import Path
          path = Path("output/audio.wav")
          assert path.exists() and path.stat().st_size > 1000
          with wave.open(str(path), "rb") as audio:
              duration = audio.getnframes() / audio.getframerate()
              print(f"Duration: {duration:.2f} seconds")
              print(f"Size: {path.stat().st_size} bytes")
              assert duration > 1
          PY

      - name: Upload TTS test audio
        uses: actions/upload-artifact@v4
        with:
          name: gemini-male-tts-test
          path: output/audio.wav
          retention-days: 3
