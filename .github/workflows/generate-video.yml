name: Generate Video

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      use_generated_script:
        description: "Use the script artifact from the parent workflow"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated script from parent workflow
        if: ${{ inputs.use_generated_script }}
        uses: actions/download-artifact@v4
        with:
          name: generated-script
          path: content

      - name: Install FFmpeg, Japanese fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Download curated official Irasutoya illustrations
        run: python scripts/download_illustrations.py

      - name: Generate illustrated vertical video
        run: python scripts/render_video.py

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/video.mp4
          retention-days: 7
