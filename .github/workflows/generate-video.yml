name: Generate Video

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Japanese fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Download illustrations from official Irasutoya search
        run: python scripts/download_illustrations.py

      - name: Generate illustrated vertical video
        run: python scripts/render_video.py

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/video.mp4
          retention-days: 7
