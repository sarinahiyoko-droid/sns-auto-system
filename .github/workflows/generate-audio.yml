
name: Generate Japanese Audio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsndfile1

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<81" wheel

      - name: Install CPU PyTorch
        run: |
          python -m pip install torch==2.3.1+cpu torchaudio==2.3.1+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install MeloTTS
        run: |
          git clone --depth 1 https://github.com/myshell-ai/MeloTTS.git
          cd MeloTTS
          python -m pip install -e .
          python -m unidic download
          python melo/init_downloads.py

      - name: Generate Japanese voice
        run: |
          mkdir -p output

          python - <<'PY'
          import json
          from melo.api import TTS

          with open("content/script.json", encoding="utf-8") as f:
              data = json.load(f)

          text = data["narration"]

          model = TTS(language="JP", device="cpu")
          speaker_ids = model.hps.data.spk2id

          model.tts_to_file(
              text,
              speaker_ids["JP"],
              "output/audio.wav",
              speed=1.0
          )

          print("Japanese audio generated successfully!")
          PY

      - name: Save audio
        uses: actions/upload-artifact@v4
        with:
          name: japanese-audio
          path: output/audio.wav
          retention-days: 7
