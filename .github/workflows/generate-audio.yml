name: Generate Japanese Audio

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      use_generated_script:
        description: "Use the script artifact from the parent workflow"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated script from parent workflow
        if: ${{ inputs.use_generated_script }}
        uses: actions/download-artifact@v4
        with:
          name: generated-script
          path: content

      - name: Generate Japanese male narration with Gemini TTS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_audio.py

      - name: Validate audio file
        run: |
          python - <<'PY'
          import wave
          from pathlib import Path
          path = Path("output/audio.wav")
          assert path.exists() and path.stat().st_size > 1000
          with wave.open(str(path), "rb") as audio:
              duration = audio.getnframes() / audio.getframerate()
              print(f"Audio duration: {duration:.2f} seconds")
              if duration < 17:
                  raise RuntimeError("Narration is too short to fill the 20-second video.")
              if duration > 23:
                  raise RuntimeError("Narration is too long for the 20-second video.")
          PY

      - name: Save audio
        uses: actions/upload-artifact@v4
        with:
          name: japanese-audio
          path: output/audio.wav
          retention-days: 7
